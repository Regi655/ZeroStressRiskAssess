[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zerostressriskassess"
dynamic = ["version"]
description = "Risk assessment of an Ubuntu machine: risk = impact × likelihood, in a single command"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["paramiko>=3.0"]

[project.scripts]
zsra = "zerostressriskassess.cli:main"

[tool.setuptools]
packages = ["zerostressriskassess", "zerostressriskassess.scanners"]

[tool.setuptools.package-data]
# startup banner artwork (see banner.py): plain text file, replaceable
zerostressriskassess = ["mascot.txt"]

[tool.setuptools.dynamic]
version = {attr = "zerostressriskassess.__version__"}
