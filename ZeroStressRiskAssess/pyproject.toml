[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zerostressriskassess"
dynamic = ["version"]
description = "Risk assessment of a Linux machine (Ubuntu/Debian, RHEL family): risk = impact × likelihood, in a single command"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["paramiko>=3.0"]

[project.optional-dependencies]
# report.pdf (pdfreport.py): optional, installed by setup.sh; without it the other formats are written as usual
pdf = ["reportlab>=4.0"]
# web interface (zsra-web, zerostressriskassess/web): optional; the command line works without it
web = ["streamlit>=1.50"]

[project.scripts]
zsra = "zerostressriskassess.cli:main"
zsra-finalize = "zerostressriskassess.finalize:main"
zsra-compare = "zerostressriskassess.compare:main"
zsra-inventory = "zerostressriskassess.inventory:main"
zsra-pdf = "zerostressriskassess.pdfreport:main"
zsra-web = "zerostressriskassess.web:main"
zsra-portal = "zerostressriskassess.portal:main"

[tool.setuptools]
packages = ["zerostressriskassess", "zerostressriskassess.scanners", "zerostressriskassess.web"]

[tool.setuptools.package-data]
# startup banner artwork (see banner.py): plain text file, replaceable
zerostressriskassess = ["mascot.txt"]

[tool.setuptools.dynamic]
version = {attr = "zerostressriskassess.__version__"}
